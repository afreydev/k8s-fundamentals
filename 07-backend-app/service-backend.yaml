apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  selector:
    app: backend                # matches the label on Deployment pods
  ports:
    - protocol: TCP
      port: 80                  # cluster-internal port
      targetPort: 5000          # container port
      nodePort: 30085           # external port (nginx uses 30080, echo uses 30090)
